name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest  # mlx-whisper needs Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --locked --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
